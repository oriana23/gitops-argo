{{- if .Values.operators.keda.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: {{ .Values.operators.keda.version | quote }}
    helm:
      releaseName: keda
  destination:
    server: {{ .Values.destinationServer }}
    namespace: keda
  syncPolicy:
{{ include "local-operators.syncPolicy" . | indent 4 }}
{{- end }}

