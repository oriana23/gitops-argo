{{- if .Values.operators.externalSecrets.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: {{ .Values.operators.externalSecrets.version | quote }}
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
  destination:
    server: {{ .Values.destinationServer }}
    namespace: external-secrets
  syncPolicy:
{{ include "local-operators.syncPolicy" . | indent 4 }}
{{- end }}

