{{- if .Values.operators.argoRollouts.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
spec:
  project: {{ .Values.project }}
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: {{ .Values.operators.argoRollouts.version | quote }}
    helm:
      releaseName: argo-rollouts
      values: |
        dashboard:
          enabled: true
  destination:
    server: {{ .Values.destinationServer }}
    namespace: argo-rollouts
  syncPolicy:
{{ include "local-operators.syncPolicy" . | indent 4 }}
{{- end }}

